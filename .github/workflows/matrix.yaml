name: Matrix Workflow
on: workflow_dispatch
jobs:
  deploy-on-ubutu:
        runs-on: ubuntu-latest
        steps:
        - name: welcome message
          run: echo "welcome to the GA actions"
        - name: Run image
          run: echo "docker run --rm hello-world"

  deploy-on-windows:
        runs-on: windows-latest
        steps:
        - name: Echo docker details
          run: docker info
        - name: Run image
          run: docker run --rm hello-world

