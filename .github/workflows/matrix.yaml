name: Matrix Workflow
on: workflow_dispatch
jobs:
  deploy:
        strategy:
          matrix:
            os: [ubuntu-latest, windows-latest]
            images: [hello-world, alpine:latest]
        runs-on: ${{ matrix.os }}
        steps:
        - name: welcome message
          run: echo "welcome to the GA actions"
        - name: Run image
          run: docker run --rm ${{ matrix.images }}

