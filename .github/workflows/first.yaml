name: first GA workflow
on: push
jobs:

  built_job:
    runs-on: ubuntu-latest
    steps:
    - name: welcome messgae
      run: echo "welcome to the GA actions"

    - name: checkout repository
      uses: actions/checkout@v4

    - name: Run commands
      run : |
          chmod +x ./script.sh
          ./script.sh > cowsay.txt
  
  test_job:
    runs-on: ubuntu-latest
    needs: built_job
    steps:
    - name: Sleep action
      run: sleep 10

    - name: check cowsay file
      run: grep -i 'swapnil' cowsay.txt

  deploy_job:
    needs: [test_job]
    runs-on: ubuntu-latest
    steps:
    - name: Read cowsay file
      run: cat cowsay.txt
