name: first GA workflow
on: push
jobs:
  
  built_job:
    runs-on: ubuntu-latest
    steps:
    - name: welcome messgae
      run: echo "welcome to the GA actions"

    - name: checkout repository
      uses: actions/checkout@v4

    - name: Run commands
      run : |
          chmod +x ./script.sh
          ./script.sh > cowsay.txt

    - name: Upload cowsay file 
      uses: actions/upload-artifact@v4
      with:
        name: cowsay-file

  test_job:
    runs-on: ubuntu-latest
    needs: built_job
    steps:
    - name: Download cowsay file
      uses: actions/download-artifact@v4
      with:
        name: cowsay-file

    - name: check cowsay file
      run: grep -i 'swapnil' cowsay.txt
  
  deploy_job:
    needs: [test_job]
    runs-on: ubuntu-latest
    steps:
    - name: Download cowsay file
      uses: actions/download-artifact@v4
      with:
        name: cowsay-file
  
    - name: Read cowsay file
      run: cat cowsay.txt