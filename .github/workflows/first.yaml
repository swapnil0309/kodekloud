name: First GA workflow
on: workflow_dispatch
jobs:
  built_job:
    runs-on: ubuntu-latest
    steps:
    - name: welcome message
      run: echo "welcome to the GA actions"

    - name: checkout 
      uses: actions/checkout@v4

    - name: Run commands
      run : |
          chmod +x ./script.sh
          ./script.sh
    
    - name : create cowsay file
      run:   cowsay "Hello, Swapnil!" > cowsay.txt

    - name: Upload cowsay file 
      uses: actions/upload-artifact@v4
      with:
        name: cowsay-txt-file
        path: cowsay.txt

  test_job:
    runs-on: ubuntu-latest
    needs: built_job
    steps:
    - name: Download cowsay file
      uses: actions/download-artifact@v4
      with:
        name: cowsay-txt-file

    - name: check cowsay file
      run: grep -i 'swapnil' cowsay.txt

    - name: sleep for 20 seconds
      run: sleep 20

  deploy_job:
    needs: [test_job]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy_job
      cancel-in-progress: true
    steps:
    - name: Download cowsay file
      uses: actions/download-artifact@v4
      with:
        name: cowsay-txt-file

    - name: List the files in the current directory
      run: ls -la
  
    - name: Read cowsay file
      run: cat cowsay.txt
